<div class="filtros-panel" id="filtrosPanel">
  <div class="filtros-header-movil">
    <h3>Filtros de Búsqueda</h3>
    <button class="modal-cerrar" id="btnCerrarFiltrosMovil">✕</button>
  </div>
  
  <div class="filtros-grid">
    <div class="filtro-grupo"><label class="filtro-label">Categoría / Paso</label><select id="filtroCategoria" class="filtro-select"><option value="">Todas</option></select></div>
    <div class="filtro-grupo"><label class="filtro-label">Tipo de testimonio</label><select id="filtroTipo" class="filtro-select"><option value="">Todos</option></select></div>
    <div class="filtro-grupo"><label class="filtro-label">Intensidad</label><select id="filtroIntensidad" class="filtro-select"><option value="">Todas</option></select></div>
    <div class="filtro-grupo"><label class="filtro-label">Momento en el evento</label><select id="filtroMomento" class="filtro-select"><option value="">Cualquiera</option></select></div>
    <div class="filtro-grupo"><label class="filtro-label">Estado del tema</label><select id="filtroEstado" class="filtro-select"><option value="">Todos</option><option value="Completo">Completo</option><option value="Revisión">Revisión</option></select></div>
    <div class="filtro-grupo"><label class="filtro-label">Sensibilidad</label><select id="filtroSensibilidad" class="filtro-select"><option value="">Todas</option><option value="normal">Normal</option><option value="sensible">Sensible</option><option value="crisis">Crisis</option></select></div>
  </div>
  
  <div class="filtros-acciones">
    <button class="btn-reset-filtros" id="btnResetFiltros">Limpiar filtros</button>
    <button class="btn-primario btn-aplicar-movil" id="btnAplicarFiltrosMovil">Ver resultados</button>
    <span class="filtros-resultado" id="filtrosResultado"></span>
  </div>
</div>
